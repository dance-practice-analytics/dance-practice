# Supabase project config. `supabase config push` only writes the properties declared
# here; everything else stays as set in the dashboard. Preview with `supabase config diff`.
project_id = "fcdgjzlbjrzkonaained"

[auth]
# Matches the sign-up form (FR-3.1.1).
minimum_password_length = 10
# Where account emails (password reset, FR-3.1.3) may send the user back. A redirectTo
# that matches none of these falls back to site_url. The app sends
# <origin><base path>#/reset-password.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",                               # npm run dev
  "http://localhost:4173/**",                               # npm run preview
  "https://dance-practice-analytics.github.io/dance-practice/**", # GitHub Pages
]

[auth.email]
# Prototype: the built-in SMTP is rate-limited, so sign-up does not wait for a confirmation
# email. Turn this back on with a custom SMTP before real participants use it.
enable_confirmations = false
